name: TikTok Download

on:
  workflow_dispatch:
    inputs:
      url:
        description: "TikTok URL"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Download TikTok
        id: download
        run: |
          mkdir -p output
          yt-dlp \
            --no-playlist \
            --retries 3 \
            -o "output/video.%(ext)s" \
            "${{ inputs.url }}"

      - name: Upload artifact
        if: steps.download.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-video
          path: output/video.mp4
