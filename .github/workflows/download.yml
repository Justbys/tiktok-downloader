name: TikTok Download

on:
  workflow_dispatch:
    inputs:
      url:
        description: "TikTok URL"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade yt-dlp

      - name: Download TikTok
        id: download
        shell: bash
        run: |
          mkdir -p output

          if yt-dlp \
            --no-playlist \
            --retries 3 \
            -o "output/video.%(ext)s" \
            "${{ inputs.url }}" 2>&1 | tee download.log; then

            echo "result=success" >> "$GITHUB_OUTPUT"

          else
            if grep -qi "Log in for access" download.log; then
              echo "result=login_required" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload artifact
        if: steps.download.outputs.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-video
          path: output/video.mp4
